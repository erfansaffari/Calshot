name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix WebUI ci
      - run: npm --prefix WebUI test -- --run
      - run: npm --prefix WebUI run build
      - name: Native tests
        run: |
          status=0
          xcodebuild test -quiet -project Calshot.xcodeproj -scheme Calshot -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -resultBundlePath build/NativeTests.xcresult || status=$?
          xcrun xcresulttool get test-results summary --path build/NativeTests.xcresult --format json
          exit "$status"
