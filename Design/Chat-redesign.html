<script>
'use strict';

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={spark:'M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2z',capture:'M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M7 12h10m-5-5v10',image:'M3 4h18v16H3z M3 16l5-5 5 5 3-3 5 5 M15 8h.01',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0V5z M5 11v1a7 7 0 0 0 14 0v-1 M12 19v3 M8 22h8',arrow:'M12 20V4 M5 11l7-7 7 7',right:'M4 12h16 M14 6l6 6-6 6',check:'M5 12l4 4L19 6',copy:'M8 8h12v13H8z M16 8V3H3v13h5',calendar:'M4 5h16v16H4z M8 2v6m8-6v6M4 11h16',screen:'M3 4h18v13H3z M8 21h8m-4-4v4',wifi:'M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0M12 20h.01M2 2l20 20',close:'M6 6l12 12M18 6L6 18',stop:'M6 6h12v12H6z'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.spark}"/></svg>`;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330"><rect width="600" height="330" fill="#fffdf7"/><rect width="600" height="10" fill="#32675c"/><text x="32" y="48" font-family="sans-serif" font-size="12" fill="#32675c">NORTH BAY COLLEGE · FICTIONAL COURSE</text><text x="32" y="86" font-family="Georgia" font-size="30" fill="#243c38">Marine ecology</text><text x="32" y="115" font-family="sans-serif" font-size="13" fill="#667570">Autumn 2026 · Fieldwork &amp; key dates</text><path d="M32 137h536" stroke="#d5ddd8"/><g font-family="sans-serif" font-size="15" fill="#334b46"><text x="32" y="171">Coastal survey</text><text x="430" y="171">30 Oct · 10 AM</text><text x="32" y="213">Field journal</text><text x="430" y="213">2 Nov · 4 PM</text><text x="32" y="255">Estuary workshop</text><text x="430" y="255">Date TBD</text></g><text x="32" y="305" font-family="sans-serif" font-size="11" fill="#7b8780">Preview fixture · no real student or calendar data</text></svg>`;
const shot='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
$('#brand').innerHTML=icon('spark');$('#picker-thumb').src=shot;$('#source-image').src=shot;
let items=[], seq=0, timer, scenario='empty', pending=null, working=false, voice=false, attached=false, draft='', offline=false, streaming=false;
const titles=['Coastal survey','Field journal','Estuary workshop','Shoreline mapping: comparing habitat corridors across the northern intertidal zone','Lab discussion','Data clinic','Sediment sampling','Peer feedback','Research outline','Final field visit','Poster presentation','Old field briefing'];
const makeRows=()=>titles.map((title,i)=>({id:i,title,date:i===2?'':i===0?'2026-10-30':i===1?'2026-11-02':`2026-11-${String(i+2).padStart(2,'0')}`,checked:i!==2&&i!==11,kind:i===11?'Remove':'Add',status:'pending'}));
const item=(type,data={})=>({id:++seq,type,...data});
function say(text){$('#announcement').textContent=text}
function nearBottom(){const el=$('#timeline');return el.scrollHeight-el.scrollTop-el.clientHeight<90}
function bottom(smooth=false){const el=$('#timeline');el.scrollTo({top:el.scrollHeight,behavior:smooth?'smooth':'instant'});$('#jump').hidden=true}
function push(type,data){const follow=nearBottom();items.push(item(type,data));renderThread();if(follow)bottom();else $('#jump').hidden=false}
function message(role,text,extra={}){return item('message',{role,text,...extra})}
function user(text,extra={}){return message('user',text,extra)}
function assistant(text){return message('assistant',text)}
function settledQuestion(answer='School calendar'){return item('question',{answer})}
function receipt(rows=makeRows().slice(0,5).map((r,i)=>i===4?{...r,title:'Poster presentation'}:r)){return item('calendar',{settled:true,rows:rows.map((r,i)=>({...r,status:i===4?'failed':'saved',checked:true,date:r.date||'2026-11-03'}))})}
function history(){return [item('day',{text:'Mon, Oct 26'}),user('What does tomorrow look like?'),assistant('<h2>A little room to breathe.</h2><p>You have two events on <strong>Tuesday, October 27</strong>. I checked Personal, School and Work.</p><table><thead><tr><th>Time</th><th>What’s on</th><th>Calendar</th></tr></thead><tbody><tr><td>9–10 AM</td><td>Studio planning</td><td>Work</td></tr><tr><td>2–3 PM</td><td>Marine ecology lab</td><td>School</td></tr></tbody></table><p>Your morning opens up after 10. <a href="#upcoming" data-agenda>See the upcoming tasks</a> if you’d like to plan around them.</p>'),item('day',{text:'Yesterday'}),user('Mark the lab prep and reading as complete.'),item('task',{settled:true,rows:['Prepare lab kit','Read the estuary field guide']}),assistant('<p>Both task results are saved below your request. Your calendar hasn’t changed.</p>'),user('Add these course dates to my calendar.',{image:true}),settledQuestion(),receipt(),assistant('<p>Four events were added to <strong>School</strong>. The poster presentation didn’t save; its retry stays with the receipt above.</p>'),item('day',{text:'Today'}),user('Help me make space for fieldwork this week.'),assistant('<h2>Let’s start with the fixed points.</h2><p>There’s a coastal survey on Friday and a field journal due next week.</p><ul><li><strong>Friday, 10–11 AM:</strong> Coastal survey · School</li><li><strong>Monday, 4–5 PM:</strong> Field journal · School</li></ul><p>Would you like me to look for a free study block around them?</p>')]}
function load(name){clearInterval(timer);scenario=name;working=false;streaming=false;voice=false;attached=false;draft='';offline=false;pending=null;items=[];$('#jump').hidden=true;$('#simulate').hidden=name!=='history';$('#banner').innerHTML='';
if(name==='empty')items=[item('welcome')];
if(name==='history')items=history();
if(name==='working'){items=[item('day',{text:'Today'}),user('Find a quiet hour for fieldwork prep this week.'),item('activity',{live:true}),assistant('<p>I’m comparing your School, Work and Personal calendars<span class="caret" aria-hidden="true"></span></p>')];working=true;streaming=true;timer=setTimeout(()=>{if(!working)return;items.find(x=>x.type==='activity').live=false;items[items.length-1].text='<p>I found a few gaps across the week. I’m checking which ones give you a full hour<span class="caret" aria-hidden="true"></span></p>';renderThread();say('Searched 3 calendars. 12 events found.');},2600)}
if(name==='question'){items=[item('day',{text:'Today'}),user('Move my planning session to the right calendar.'),assistant('<p>I found the session on Personal. Which calendar should I move it to?</p>')];pending=item('question');items.push(pending)}
if(name==='calendar'){items=[item('day',{text:'Today'}),user('Add these dates to School and remove the old field briefing.',{image:true}),settledQuestion('School · confirmed 2026 dates'),assistant('<p>Here’s the review. The workshop needs a date, and the removal is unchecked.</p>')];pending=item('calendar',{rows:makeRows()});items.push(pending)}
if(name==='results')items=[item('day',{text:'Today'}),user('Add the five confirmed fieldwork dates to School.'),receipt(),assistant('<p>Four events were added. The poster presentation couldn’t be saved. You can retry just that event from its receipt.</p>')];
if(name==='tasks'||name==='taskResult'){items=[item('day',{text:'Today'}),user('Mark the lab prep and reading as complete.')];const t=item('task',{settled:name==='taskResult',rows:['Prepare lab kit','Read the estuary field guide, including the notes on shoreline sampling and habitat protection']});items.push(t);if(!t.settled)pending=t;else items.push(assistant('<p>The two task changes are confirmed by the saved task receipts.</p>'))}
if(name==='error'){offline=true;items=[item('day',{text:'Today'}),user('What do I have tomorrow?'),item('activity',{live:false,incomplete:true}),item('error')];}
if(name==='voice'){voice=true;items=[item('day',{text:'Today'}),assistant('<p>I’m listening. Tell me what you’d like to do with the dates on your screen.</p>')];}
if(name==='stopped')items=[item('day',{text:'Today'}),user('Add the confirmed fieldwork dates.'),receipt(makeRows().slice(0,2)),item('notice',{text:'Stopped. Two events were saved to School before you stopped. The remaining proposals were skipped.'}),assistant('<p>Your completed changes are kept. Tell me what you’d like to do next.</p>')];
if(name==='interrupted')items=[item('day',{text:'Today'}),user('Move the field briefing from Personal to Work.'),item('interrupted')];
renderThread();renderComposer();renderBanner();$('#timeline').scrollTo({top:0,behavior:'instant'});if(name!=='empty'&&name!=='history')bottom();$('#scenario').value=name;
}
function tools(m){return `<div class="message-tools"><button data-copy="${m.id}" aria-label="Copy ${m.role} message">${icon('copy')} Copy</button><time datetime="2026-10-29T09:24:00">9:24 AM</time></div>`}
function rowMarkup(r,settled){return `<div class="proposal">${settled?icon(r.status==='saved'?'check':'calendar'):`<input type="checkbox" data-row="${r.id}" aria-label="Include ${esc(r.title)}" ${r.checked?'checked':''} ${!r.date?'disabled':''}>`}<div class="row-body">${!settled?`<span class="tag ${r.kind==='Remove'?'remove':''}">${r.kind}</span>`:''}<div class="row-title">${esc(r.title)}</div><div class="row-meta">${r.date?esc(r.date)+(r.id===1?' · 4–5 PM · America/Toronto':' · 10–11 AM · America/Toronto'):'Date unresolved · 10–11 AM · America/Toronto'} · School</div>${!settled&&r.kind==='Remove'?'<p class="row-meta">Existing event · School · select to remove this occurrence.</p>':''}${!r.date&&!settled?`<p class="issue" id="date-help">Choose the full date from the source to include this event.</p><div class="field"><label for="missing-date">Workshop date</label><input type="date" id="missing-date" aria-describedby="date-help" data-date="${r.id}"></div>`:''}${r.status==='failed'?`<div class="row-error" role="alert">Not saved. School couldn’t be reached. The other events are saved. <button data-retry="${r.id}">Retry this event</button></div>`:''}</div>${settled?`<span class="row-status ${r.status==='failed'?'danger':''}">${r.status==='saved'?(r.kind==='Remove'?'Removed ✓':'Saved ✓'):r.status==='failed'?'Failed':r.status==='unresolved'?'Unresolved':'Skipped'}</span>`:''}</div>`}
function calendarMarkup(m){if(m.settled){const saved=m.rows.filter(x=>x.status==='saved'&&x.kind!=='Remove').length, removed=m.rows.filter(x=>x.status==='saved'&&x.kind==='Remove').length, failed=m.rows.filter(x=>x.status==='failed').length, skipped=m.rows.filter(x=>x.status==='skipped').length, unresolved=m.rows.filter(x=>x.status==='unresolved').length;return `<div class="receipt-wrap"><details class="receipt" ${m.open?'open':''}><summary><span>✓ ${saved} events added to School${removed?` · ${removed} removed`:''}</span>${failed?` · ${failed} failed`:''}${skipped?` · ${skipped} skipped`:''}${unresolved?` · ${unresolved} unresolved`:''}<small> · View receipts</small></summary><div class="receipt-content">${m.rows.map(r=>rowMarkup(r,true)).join('')}<div class="retry-summary">Persisted calendar receipts · this Mac · 9:24 AM</div></div></details>${failed?`<div class="retry-outside">${failed} event didn’t save <button class="text-button" data-open-retry="${m.id}">Review & retry</button></div>`:''}</div>`}const n=m.rows.filter(r=>r.checked&&r.date).length;return `<section class="card live-card" aria-label="Pending calendar review"><div class="card-head"><div class="eyebrow">${icon('calendar')} Calendar review</div><h2>12 calendar changes</h2><p>Review the exact changes. Nothing is saved until you approve.</p></div><div class="route">Source <strong>Syllabus screenshot</strong>${icon('right')}<span>Destination <strong>School · iCloud</strong></span></div><div class="review-list" tabindex="0" aria-label="12 proposed events">${m.rows.map(r=>rowMarkup(r,false)).join('')}</div><footer class="card-foot"><small id="selection-count">${n} selected · ${m.rows.filter(r=>!r.date).length} needs a date</small><button class="secondary" data-skip>Skip</button><button class="primary" data-approve ${!n?'disabled':''}>Approve ${n}</button></footer></section>`}
function taskMarkup(m){return m.settled?`<details class="receipt"><summary><span>✓ Task change applied: 2 tasks completed</span><small> · View receipts</small></summary><div class="receipt-content">${m.rows.map(t=>`<div class="proposal">${icon('check')}<div class="row-body"><div class="row-title">${esc(t)}</div><div class="row-meta">Tasks · Completed · Saved on this Mac</div></div><span class="row-status">Saved ✓</span></div>`).join('')}</div></details>`:`<section class="card live-card" aria-label="Pending task review"><div class="card-head"><div class="eyebrow">${icon('check')} Task review</div><h2>Complete these 2 tasks?</h2><p>Only their task status changes. No calendar events will change.</p></div>${m.rows.map(t=>`<div class="proposal"><div class="row-body"><div class="row-title">${esc(t)}</div><div class="row-meta">Tasks · In progress → Completed</div></div></div>`).join('')}<footer class="card-foot"><small>2 tasks · explicit review</small><button class="secondary" data-skip>Cancel</button><button class="primary" data-approve>Complete 2 tasks</button></footer></section>`}
function questionMarkup(m){if(m.answer)return `<details class="receipt"><summary>✓ You chose: <strong>${esc(m.answer)}</strong></summary><div class="proposal"><p class="row-meta">Which calendar should I use?<br>Answer recorded for this question. No changes approved.</p></div></details>`;if(m.cancelled)return '<div class="notice">Question cancelled. No changes made.</div>';return `<section class="card live-card" aria-label="Question from Calshot"><div class="card-head"><div class="eyebrow">${icon('spark')} One detail</div><h2>Which calendar should I use?</h2><p>I’ll keep the original time. Choose a destination for the planning session.</p></div><div class="choices">${['Work calendar','School · lectures, labs and fieldwork','Personal · appointments and time away','North Bay research group · shared planning and community shoreline restoration sessions','Field station · team availability and extended research visits','Teaching · seminars, studio reviews and undergraduate mentoring'].map(t=>`<button class="choice" data-answer="${esc(t)}"><span>${esc(t)}</span>${icon('right')}</button>`).join('')}<button class="choice" data-other>Other…</button></div><form class="other-form" id="other-form" hidden><input id="other-answer" aria-label="Other calendar or answer" placeholder="Tell me which calendar…" required maxlength="500"><button class="primary">Answer</button></form><footer class="card-foot"><small>Or type an answer below</small><button class="secondary" data-skip>Cancel</button></footer></section>`}
function welcome(){return `<div class="welcome"><div class="welcome-mark">${icon('spark')}</div><h1>A little more room<br>in your day.</h1><p>What can I help you make time for?</p><div class="suggestions">${['What’s on tomorrow?','Find time to focus','Add my course dates'].map(t=>`<button data-prompt="${esc(t)}">${t}</button>`).join('')}</div><div class="tiles"><button class="tile" data-capture>${icon('capture')}<strong>Capture screen</strong><small>A schedule, syllabus or poster</small></button><button class="tile" data-attach>${icon('image')}<strong>Use a screenshot</strong><small>Pick from your captures</small></button><button class="tile" data-voice>${icon('mic')}<strong>Talk to Calshot</strong><small>Say it in your own words</small></button></div><section class="upcoming" id="upcoming" aria-label="Upcoming tasks"><div class="eyebrow">A little ahead · 2 upcoming tasks</div><div class="task-mini"><span class="circle" aria-hidden="true"></span><span>Prepare fieldwork kit</span><small>Tomorrow</small></div><div class="task-mini"><span class="circle" aria-hidden="true"></span><span>Finish field journal</span><small>Mon, Nov 2</small></div></section></div>`}
function renderThread(){const el=$('#timeline'), y=el.scrollTop;$('#thread').innerHTML=items.map(m=>`<div class="timeline-item ${m.role==='user'?'message user':''}" data-item="${m.id}" ${m.role==='user'?'role="article" aria-label="Your message"':''}>${m.type==='welcome'?welcome():m.type==='day'?`<div class="day">${esc(m.text)}</div>`:m.type==='message'?m.role==='user'?`${m.image?`<button class="screenshot-message" data-source aria-label="View attached syllabus screenshot"><img class="source-thumb" src="${shot}" alt="Marine ecology syllabus"><span class="source-label">Marine ecology · screenshot</span></button><br>`:''}${esc(m.text)}${tools(m)}`:`<article class="message assistant" aria-label="Calshot message">${m.text}${tools(m)}</article>`:m.type==='question'?questionMarkup(m):m.type==='calendar'?calendarMarkup(m):m.type==='task'?taskMarkup(m):m.type==='activity'?`<details class="activity"><summary><span class="${m.live?'shimmer':''}">${m.live?'Searching 3 calendars…':m.incomplete?'Searched 2 of 3 calendars · Incomplete':'Searched 3 calendars · 12 events'}</span></summary><p>Personal · ${m.incomplete?'Read complete':'4 events'}<br>School · ${m.incomplete?'Unavailable':'6 events'}<br>Work · ${m.incomplete?'Read complete':'2 events'}</p></details>`:m.type==='error'?`<div class="row-error" role="alert"><strong>School couldn’t be read.</strong><p>Your connection dropped. Tomorrow’s results are incomplete; I can’t confirm your availability yet.</p><button data-try>Try again</button></div>`:m.type==='interrupted'?`<section class="card"><div class="card-head"><div class="eyebrow">Interrupted transfer</div><h2>A copy is safe in Work.</h2><p>The original may still be in Personal. Check both before continuing.</p></div><div class="route"><strong>Personal</strong>${icon('right')}<strong>Work</strong></div><div class="proposal"><div class="row-body"><div class="row-title">Field briefing · Oct 30, 2026 · 9–10 AM</div><div class="row-meta success">Destination receipt: copy verified in Work.</div><div class="row-error">Original removal wasn’t confirmed. No new copy will be created.<br><button data-reconcile>Check original</button></div></div></div></section>`:`<div class="notice">${esc(m.text)}</div>`}</div>`).join('');el.scrollTo({top:y,behavior:'instant'});}
function renderBanner(){ $('#banner').innerHTML=offline?`<div class="offline" role="alert">${icon('wifi')}<span>You’re offline. Your conversation is kept.</span><button data-online>Reconnect</button></div>`:'' }
function renderComposer(){if(voice){$('#composer').innerHTML=`<div class="composer" aria-label="Voice session"><div class="voice-head"><span class="levels" aria-hidden="true">${Array.from({length:7},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</span><strong role="status">Listening…</strong><button data-stop-voice>${icon('stop')} Stop</button></div><p class="voice-caption">“Add the coastal survey on Friday at ten to School.”</p><div class="screen-indicator">${icon('screen')} Calshot can see your screen · one frame per turn</div><small>Voice preview · API route explicitly selected in this fixture</small></div>`;return}$('#composer').innerHTML=`<form class="composer" id="message-form">${attached?`<div class="attached"><img src="${shot}" alt="Syllabus attachment"><span>Marine ecology syllabus</span><button type="button" class="icon-button" data-remove aria-label="Remove screenshot attachment">${icon('close')}</button></div>`:''}<textarea id="input" rows="1" maxlength="8000" aria-label="${pending?.type==='question'?'Answer Calshot':'Message Calshot'}" placeholder="${pending?.type==='question'?'Type your answer…':pending?'Review the proposed changes above…':'Ask anything about your day…'}" ${working||pending&&pending.type!=='question'?'disabled':''}>${esc(draft)}</textarea><div class="composer-tools"><button type="button" class="icon-button" data-capture aria-label="Capture screen" title="Capture screen" ${working||pending?'disabled':''}>${icon('capture')}</button><button type="button" class="icon-button" data-attach aria-label="Attach a screenshot from history" title="Use a screenshot" ${working||pending?'disabled':''}>${icon('image')}</button><button type="button" class="icon-button mic" data-voice aria-label="Start voice mode" title="Talk to Calshot" ${working||pending?'disabled':''}>${icon('mic')}</button><button type="${working?'button':'submit'}" class="send primary" ${working?'data-stop':''} aria-label="${working?'Stop response':'Send message'}" ${!working&&!draft.trim()&&!attached?'disabled':''}>${icon(working?'stop':'arrow')}</button></div></form>`;grow();}
function grow(){const t=$('#input');if(t){t.style.height='auto';t.style.height=Math.min(176,t.scrollHeight)+'px'}}
function answer(text){if(!pending||pending.type!=='question')return;pending.answer=text;pending=null;draft='';renderThread();push('message',{role:'assistant',text:'<p>I’ll use <strong>'+esc(text)+'</strong>. Your answer stays here; any calendar change will have its own review.</p>'});renderComposer();say('Answer recorded: '+text);$('#input')?.focus()}
function approve(){if(!pending)return;const p=pending;if(p.type==='calendar'){const rows=p.rows.filter(r=>r.checked&&r.date);if(!rows.length)return;p.rows=p.rows.map(r=>({...r,status:!r.date?'unresolved':!r.checked?'skipped':r.id===4?'failed':'saved'}));p.settled=true}else if(p.type==='task')p.settled=true;else return;pending=null;renderThread();renderComposer();say('Review settled. Per-row receipts are available.');$('#input')?.focus()}
function skip(){if(!pending)return;const p=pending;if(p.type==='question')p.cancelled=true;else if(p.type==='calendar'){p.settled=true;p.rows=p.rows.map(r=>({...r,status:!r.date?'unresolved':'skipped'}))}else{p.type='notice';p.text='Task change cancelled. Both tasks are unchanged.'}pending=null;renderThread();renderComposer();say('Cancelled. No new changes made.');$('#input')?.focus()}
function stop(){if(!working)return;clearTimeout(timer);working=false;streaming=false;items.forEach(m=>{if(m.type==='activity')m.live=false;if(m.type==='message'&&m.role==='assistant')m.text=m.text.replace(/<span class="caret"[^>]*><\/span>/g,'')});push('notice',{text:'Stopped. No calendar changes were made. You can continue here.'});renderComposer();say('Response stopped');$('#input')?.focus()}
function send(){const t=$('#input');const text=t?.value.trim();if(working||!text&&!attached)return;if(pending){if(pending.type==='question')answer(text);return}items=items.filter(m=>m.type!=='welcome');if(!items.length)items.push(item('day',{text:'Today'}));push('message',{role:'user',text:text||'Add the dates from this screenshot.',image:attached});draft='';attached=false;push('message',{role:'assistant',text:'<p>I can help with that. This is a design preview; any proposed calendar changes will appear here for your review.</p>'});renderComposer();$('#input')?.focus();bottom()}
function attach(){attached=true;renderComposer();$('#input')?.focus();say('Fictional screenshot attached')}
function stopVoice(){voice=false;push('message',{role:'user',text:'Add the coastal survey on Friday at ten to School.'});push('notice',{text:'Voice session ended. Screen viewing and listening are off. Calendar changes still require a review.'});renderComposer();$('#input')?.focus();say('Voice stopped. Screen viewing off.')}
$('#scenario').onchange=e=>load(e.target.value);$('#theme').onclick=()=>{const dark=document.documentElement.dataset.appearance!=='dark';document.documentElement.dataset.appearance=dark?'dark':'light';$('#theme').textContent=dark?'Light':'Dark';$('#theme').setAttribute('aria-label',`Switch to ${dark?'light':'dark'} appearance`)};$('#compact').onclick=()=>{const on=$('#shell').classList.toggle('compact');$('#compact').setAttribute('aria-pressed',String(on))};$('#jump').onclick=()=>bottom(true);$('#timeline').onscroll=()=>{if(nearBottom())$('#jump').hidden=true};$('#simulate').onclick=()=>{push('message',{role:'assistant',text:'<p>A new thought while you’re reading: I can check the afternoon on Thursday for fieldwork prep.</p>'});say('New reply arrived')};
document.addEventListener('input',e=>{if(e.target.id==='input'){draft=e.target.value;grow();const b=$('#message-form .send');b.disabled=!draft.trim()&&!attached}});
document.addEventListener('change',e=>{if(e.target.matches('[data-row]')&&pending?.type==='calendar'){pending.rows.find(r=>r.id===Number(e.target.dataset.row)).checked=e.target.checked;updateCount()}if(e.target.matches('[data-date]')&&pending?.type==='calendar'){const r=pending.rows.find(r=>r.id===Number(e.target.dataset.date));r.date=e.target.value;if(r.date){renderThread();say('Workshop date resolved. Select its checkbox to include it.');$(`[data-row="${r.id}"]`).focus()}}});
function updateCount(){const n=pending.rows.filter(r=>r.checked&&r.date).length;$('#selection-count').textContent=`${n} selected · ${pending.rows.filter(r=>!r.date).length} needs a date`;const b=$('[data-approve]');b.textContent='Approve '+n;b.disabled=!n}
document.addEventListener('submit',e=>{if(e.target.id==='message-form'){e.preventDefault();send()}if(e.target.id==='other-form'){e.preventDefault();answer($('#other-answer').value.trim())}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='input'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}if(e.key==='Enter'&&e.metaKey&&pending?.type!=='question'&&pending){e.preventDefault();approve()}if(e.key==='Escape'&&voice)stopVoice()});
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;
if(b.hasAttribute('data-close'))b.closest('dialog').close();
if(b.hasAttribute('data-prompt')){draft=b.dataset.prompt;renderComposer();$('#input').focus()}
if(b.hasAttribute('data-capture'))attach();
if(b.hasAttribute('data-attach'))$('#picker').showModal();
if(b.id==='pick-image'){$('#picker').close();attach()}
if(b.hasAttribute('data-source'))$('#source-dialog').showModal();
if(b.hasAttribute('data-remove')){attached=false;renderComposer();$('#input').focus()}
if(b.hasAttribute('data-voice')){voice=true;renderComposer();$('[data-stop-voice]').focus();say('Voice preview listening. Screen indicator visible.')}
if(b.hasAttribute('data-stop-voice'))stopVoice();
if(b.hasAttribute('data-stop'))stop();
if(b.hasAttribute('data-other')){$('#other-form').hidden=false;$('#other-answer').focus()}
if(b.hasAttribute('data-answer'))answer(b.dataset.answer);
if(b.hasAttribute('data-approve'))approve();if(b.hasAttribute('data-skip'))skip();
if(b.hasAttribute('data-open-retry')){const m=items.find(m=>m.id===Number(b.dataset.openRetry));m.open=true;renderThread();const retry=$(`[data-item="${m.id}"] [data-retry]`);retry?.scrollIntoView({block:'nearest'});retry?.focus()}
if(b.hasAttribute('data-retry')){if(pending){say('Finish the latest review before retrying a saved result.');return}const m=items.find(m=>m.id===Number(b.closest('[data-item]').dataset.item));m.rows.find(r=>r.id===Number(b.dataset.retry)).status='saved';m.open=true;renderThread();say('Retried only the failed event. Saved receipt confirmed.');$(`[data-item="${m.id}"] summary`).focus()}
if(b.hasAttribute('data-online')){offline=false;renderBanner();say('Connection restored. Try the failed calendar read again.')}
if(b.hasAttribute('data-try')){offline=false;renderBanner();items=items.filter(m=>m.type!=='error');items.filter(m=>m.type==='activity').forEach(m=>m.incomplete=false);push('message',{role:'assistant',text:'<p>All three calendars were read. Tomorrow, October 30, you have a coastal survey from <strong>10–11 AM</strong> on School.</p>'});say('Read completed for all 3 calendars')}
if(b.hasAttribute('data-reconcile')){b.closest('.row-error').innerHTML='Original found in Personal. The verified Work copy is kept. Removing the original needs a fresh review.';say('Original found. No changes made.')}
if(b.hasAttribute('data-agenda')){e.preventDefault();say('Upcoming: prepare fieldwork kit tomorrow; finish field journal Monday.');push('message',{role:'assistant',text:'<p><strong>Upcoming tasks</strong><br>Prepare fieldwork kit · Tomorrow<br>Finish field journal · Monday, November 2</p>'});bottom()}
if(b.hasAttribute('data-copy')){const m=items.find(m=>m.id===Number(b.dataset.copy));const tmp=document.createElement('div');tmp.innerHTML=m.role==='user'?esc(m.text):m.text;const text=tmp.textContent;navigator.clipboard?.writeText(text).then(()=>{b.textContent='Copied';say('Message copied')}).catch(()=>say('Clipboard unavailable in this browser. Select the message text to copy.'))}
});
// Keep historic receipt actions read-only while a newer review awaits input.
new MutationObserver(()=>{document.querySelectorAll('[data-retry],[data-open-retry]').forEach(b=>{b.disabled=Boolean(pending);b.title=pending?'Finish the current review first':''})}).observe($('#thread'),{childList:true});
load('empty');
</script></body></html>
